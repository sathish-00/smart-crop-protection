<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Crop Recommendation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/crop_recommend.css') }}">
  <style>
      /* Status Bar to show weather is being scanned */
      .status-bar {
          background: #e3f2fd;
          padding: 15px;
          border-radius: 8px;
          margin-bottom: 20px;
          display: none; /* Hidden by default */
          color: #0D47A1;
          font-weight: bold;
          text-align: center;
          border: 1px solid #90caf9;
      }
      
      .loading-spinner {
          display: inline-block;
          width: 15px; height: 15px;
          border: 3px solid #0D47A1;
          border-top: 3px solid transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          vertical-align: middle;
          margin-right: 10px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <header class="app-header">
    <button type="button" class="back-btn" onclick="window.location.href='/'">Back</button>
    <h2 id="recTitle" class="page-title">Crop Recommendation</h2>
    <button id="langToggle" class="lang-btn">తెలుగు</button>
  </header>

  <main class="container">

    <div class="card">
      <h3 id="formTitle">Select Your Conditions</h3>
      
      <div id="weatherStatus" class="status-bar"></div>

      <label id="locLbl"><b>Location (State)</b></label>
      <select id="location" class="input-box">
        <option value="telangana">Telangana</option>
        <option value="andhra_pradesh">Andhra Pradesh</option>
      </select>

      <label id="seasonLbl"><b>Planning Season</b></label>
      <select id="season" class="input-box">
        <option id="season_kharif" value="kharif">Kharif (Monsoon)</option>
        <option id="season_rabi" value="rabi">Rabi (Winter)</option>
        <option id="season_summer" value="summer">Summer (Zaid)</option>
      </select>

      <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
              <label id="tempLbl"><b>Temp (°C)</b></label>
              <input type="number" id="temp" class="input-box" value="30">
          </div>
          <div style="flex: 1;">
              <label id="humLbl"><b>Humidity (%)</b></label>
              <input type="number" id="humidity" class="input-box" value="60">
          </div>
      </div>

      <label id="soilLbl"><b>Soil Type</b></label>
      <select id="soil" class="input-box">
        <option id="soil_black" value="black">Black Soil</option>
        <option id="soil_red" value="red">Red Soil</option>
        <option id="soil_sandy" value="sandy">Sandy Soil</option>
        <option id="soil_alluvial" value="alluvial">Alluvial Soil</option>
        <option id="soil_clay" value="clay">Clay Soil</option>
      </select>

      <label id="waterLbl"><b>Water Source</b></label>
      <select id="water" class="input-box">
        <option id="water_rainfed" value="rainfed">Rainfed</option>
        <option id="water_borewell" value="borewell">Borewell</option>
        <option id="water_canal" value="canal">Canal</option>
        <option id="water_drip" value="drip">Drip</option>
      </select>

      <label id="budgetLbl"><b>Budget</b></label>
      <select id="budget" class="input-box">
        <option id="budget_low" value="low">Low</option>
        <option id="budget_medium" value="medium">Medium</option>
        <option id="budget_high" value="high">High</option>
      </select>

      <button id="btnRec" onclick="startRecommendation()" class="primary-btn">
          ✨ Recommend Crops (Auto-Scan Weather)
      </button>
    </div>

    <div class="card">
      <h3 id="resultTitle">Recommended Crops</h3>
      <div id="resultsBox">
        <p id="resultMsg">Select values and click recommend.</p>
      </div>
    </div>

  </main>

  <script>
    let currentLang = localStorage.getItem("rec_lang") || "en";

    // Text Resources
    const ui = {
      en: {
        recTitle: "Crop Recommendation",
        formTitle: "Select Your Conditions",
        btnRec: "✨ Recommend Crops (Auto-Scan Weather)",
        resultTitle: "Recommended Crops",
        resultMsg: "Select values and click recommend.",
        toggleBtn: "తెలుగు",
        
        // Status Messages
        statusLoc: "📍 Detecting Location...",
        statusSat: "🛰️ Connecting to Weather Satellite...",
        statusDone: "✅ Weather Detected: ",
        statusErr: "⚠️ Weather Scan Failed. Using Manual Inputs.",
        
        // Labels
        locLbl: "Location", seasonLbl: "Season", tempLbl: "Temp (°C)", humLbl: "Humidity (%)",
        soilLbl: "Soil Type", waterLbl: "Water Source", budgetLbl: "Budget",
        
        // Options
        season_kharif: "Kharif (Monsoon)", season_rabi: "Rabi (Winter)", season_summer: "Summer",
        soil_black: "Black Soil", soil_red: "Red Soil", soil_sandy: "Sandy Soil", soil_alluvial: "Alluvial Soil", soil_clay: "Clay Soil",
        water_rainfed: "Rainfed", water_borewell: "Borewell", water_canal: "Canal", water_drip: "Drip",
        budget_low: "Low", budget_medium: "Medium", budget_high: "High",
        score: "Match", reason: "Reason", openRoadmap: "View Guide"
      },
      te: {
        recTitle: "పంట సిఫార్సు",
        formTitle: "మీ పరిస్థితులను ఎంచుకోండి",
        btnRec: "✨ పంటలను సిఫార్సు చేయండి",
        resultTitle: "సిఫార్సు చేసిన పంటలు",
        resultMsg: "విలువలను ఎంచుకొని సిఫార్సు క్లిక్ చేయండి.",
        toggleBtn: "English",

        // Status Messages
        statusLoc: "📍 స్థానాన్ని గుర్తిస్తోంది...",
        statusSat: "🛰️ వాతావరణ సమాచారం సేకరిస్తోంది...",
        statusDone: "✅ వాతావరణం గుర్తించబడింది: ",
        statusErr: "⚠️ స్కానింగ్ విఫలమైంది. మాన్యువల్ మోడ్.",

        // Labels
        locLbl: "ప్రాంతం", seasonLbl: "సీజన్", tempLbl: "ఉష్ణోగ్రత (°C)", humLbl: "తేమ (%)",
        soilLbl: "నేల రకం", waterLbl: "నీటి వనరు", budgetLbl: "బడ్జెట్",
        
        // Options
        season_kharif: "ఖరీఫ్ (వాానాకాలం)", season_rabi: "రబీ (యాసంగి)", season_summer: "వేసవి",
        soil_black: "నల్ల నేల", soil_red: "ఎర్ర నేల", soil_sandy: "ఇసుక నేల", soil_alluvial: "ఒడ్డునేల", soil_clay: "మట్టి నేల",
        water_rainfed: "వర్షాధార", water_borewell: "బోరుబావి", water_canal: "కాలువ", water_drip: "డ్రిప్",
        budget_low: "తక్కువ", budget_medium: "మధ్యస్థం", budget_high: "ఎక్కువ",
        score: "సరిపోలిక", reason: "కారణం", openRoadmap: "గైడ్ చూడండి"
      }
    };

    // --- 1. Main Trigger Function ---
    async function startRecommendation() {
        const btn = document.getElementById("btnRec");
        const status = document.getElementById("weatherStatus");
        
        // Disable button & show loading
        btn.disabled = true;
        status.style.display = 'block';
        status.innerHTML = `<div class="loading-spinner"></div> ${ui[currentLang].statusLoc}`;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => fetchWeatherAndRecommend(pos), 
                (err) => {
                    // GPS Failed -> Use Manual Inputs
                    status.innerText = ui[currentLang].statusErr;
                    fetchRecommendations(); 
                }
            );
        } else {
            // No GPS -> Use Manual Inputs
            fetchRecommendations();
        }
    }

    // --- 2. Get Weather from API ---
    async function fetchWeatherAndRecommend(position) {
        const status = document.getElementById("weatherStatus");
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        try {
            status.innerHTML = `<div class="loading-spinner"></div> ${ui[currentLang].statusSat}`;
            
            // Open-Meteo API Call
            const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`);
            const wData = await wRes.json();

            const temp = wData.current_weather.temperature;
            const hour = new Date().getHours();
            const hum = wData.hourly.relativehumidity_2m[hour];

            // 🟢 AUTO-FILL INPUTS
            document.getElementById("temp").value = temp;
            document.getElementById("humidity").value = hum;

            // Success UI Update
            status.style.background = "#e8f5e9"; 
            status.style.color = "#2e7d32";
            status.style.borderColor = "#a5d6a7";
            status.innerText = `${ui[currentLang].statusDone} ${temp}°C | Hum: ${hum}%`;
            
            // Proceed to Backend
            fetchRecommendations();

        } catch (err) {
            console.error(err);
            status.innerText = ui[currentLang].statusErr;
            fetchRecommendations(); // Fallback to manual values currently in inputs
        }
    }

    // --- 3. Send to Backend ---
    async function fetchRecommendations() {
        const btn = document.getElementById("btnRec");
        const resultsBox = document.getElementById("resultsBox");
        
        // Gather ALL inputs (Including Season, Location, Temp, Humidity)
        const data = {
            location: document.getElementById("location").value,
            season: document.getElementById("season").value,
            temp: document.getElementById("temp").value,
            humidity: document.getElementById("humidity").value,
            soil: document.getElementById("soil").value,
            water: document.getElementById("water").value,
            budget: document.getElementById("budget").value,
            lang: currentLang
        };

        try {
            const res = await fetch("/api/recommend_crop", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const responseData = await res.json();
            renderResults(responseData.recommended);

        } catch (e) {
            console.error(e);
            resultsBox.innerHTML = `<p style="color:red">System Error. Please try again.</p>`;
        } finally {
            btn.disabled = false;
        }
    }

    // --- 4. Render Results ---
    function renderResults(list) {
        const resultsBox = document.getElementById("resultsBox");
        if (!list || list.length === 0) {
            resultsBox.innerHTML = `<p>${ui[currentLang].resultMsg.replace('Select values', 'No matching crops found. Try changing Soil or Budget.')}</p>`;
            return;
        }

        let html = "";
        list.forEach(item => {
            // Calculate percentage score (Max score is ~11 in new logic)
            let percent = Math.min(100, Math.round((item.score / 11) * 100));
            
            html += `
                <div class="result-card">
                    <div class="result-head">
                        <h4>${item.crop}</h4>
                        <span class="score">${ui[currentLang].score}: ${percent}%</span>
                    </div>
                    <p><b>${ui[currentLang].reason}:</b> ${item.reason}</p>
                    <a class="open-btn" href="/crop/${item.crop_slug}">${ui[currentLang].openRoadmap}</a>
                </div>
            `;
        });
        resultsBox.innerHTML = html;
    }

    // --- UI & Language Logic ---
    function applyLang() {
        const t = ui[currentLang];
        document.getElementById("recTitle").innerText = t.recTitle;
        document.getElementById("formTitle").innerText = t.formTitle;
        document.getElementById("btnRec").innerText = t.btnRec;
        document.getElementById("resultTitle").innerText = t.resultTitle;
        document.getElementById("langToggle").innerText = t.toggleBtn;

        // Labels
        document.getElementById("locLbl").innerText = t.locLbl;
        document.getElementById("seasonLbl").innerText = t.seasonLbl;
        document.getElementById("tempLbl").innerText = t.tempLbl;
        document.getElementById("humLbl").innerText = t.humLbl;
        document.getElementById("soilLbl").innerText = t.soilLbl;
        document.getElementById("waterLbl").innerText = t.waterLbl;
        document.getElementById("budgetLbl").innerText = t.budgetLbl;

        const ids = [
            "season_kharif", "season_rabi", "season_summer",
            "soil_black","soil_red","soil_sandy","soil_alluvial","soil_clay",
            "water_rainfed","water_borewell","water_canal","water_drip",
            "budget_low","budget_medium","budget_high"
        ];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerText = t[id];
        });
    }

    document.getElementById("langToggle").addEventListener("click", () => {
        currentLang = currentLang === "te" ? "en" : "te";
        localStorage.setItem("rec_lang", currentLang);
        applyLang();
    });

    // Init
    applyLang();

  </script>

</body>
</html>
